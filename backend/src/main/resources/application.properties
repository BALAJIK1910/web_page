# ============================================================
# Application Configuration
# ============================================================
spring.application.name=ecommerce-api
server.port=${PORT:8080}

# ============================================================
# Database Configuration
# TODO: add Supabase credentials - set these environment variables
# before running the application:
#   SUPABASE_DB_URL      e.g. jdbc:postgresql://<host>:5432/<db>
#   SUPABASE_DB_USER     your Supabase DB username
#   SUPABASE_DB_PASSWORD your Supabase DB password
# ============================================================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.ydolxokkslkgbhcfxhub}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (tuned for Supabase free-tier limits)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
# ddl-auto=none: Hibernate will NOT create or alter tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pagination defaults
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=100

# Logging
logging.level.com.ecommerce=DEBUG
logging.level.org.hibernate.SQL=DEBUG
