<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — ShopEase</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── Login page specific styles ── */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            padding: 2rem 1rem;
        }
        .auth-card {
            background: var(--surface);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .auth-logo a {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }
        .auth-logo a span { color: var(--primary); }
        .auth-tabs {
            display: flex;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            overflow: hidden;
            margin-bottom: 1.75rem;
        }
        .auth-tab {
            flex: 1;
            padding: 0.65rem;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .auth-tab.active {
            background: var(--primary);
            color: #fff;
        }
        .auth-form { display: flex; flex-direction: column; gap: 1rem; }
        .auth-form .input {
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .auth-form .input:focus { border-color: var(--primary); }
        .auth-form .btn-block {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }
        .auth-error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 0.5rem;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            display: none;
        }
        .auth-error.show { display: block; }
        .auth-switch {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-switch button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: inherit;
            padding: 0;
        }
        .form-panel { display: none; }
        .form-panel.active { display: flex; flex-direction: column; gap: 1rem; }
        @media (prefers-color-scheme: dark) {
            .auth-error { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <a href="index.html">Shop<span>Ease</span></a>
                <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.35rem">Your online store</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
                <button class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Error message -->
            <div class="auth-error" id="authError"></div>

            <!-- Sign In Form -->
            <div class="form-panel active" id="panelSignIn">
                <form class="auth-form" id="signInForm" novalidate>
                    <input type="email" name="email" class="input" placeholder="Email address" required autocomplete="email" />
                    <input type="password" name="password" class="input" placeholder="Password" required autocomplete="current-password" />
                    <button type="submit" class="btn btn-primary btn-block" id="signInBtn">Sign In</button>
                </form>
            </div>

            <!-- Sign Up Form -->
            <div class="form-panel" id="panelSignUp">
                <form class="auth-form" id="signUpForm" novalidate>
                    <input type="text" name="fullName" class="input" placeholder="Full name" required autocomplete="name" />
                    <input type="email" name="email" class="input" placeholder="Email address" required autocomplete="email" />
                    <input type="password" name="password" class="input" placeholder="Password (min 6 chars)" required autocomplete="new-password" />
                    <input type="password" name="confirmPassword" class="input" placeholder="Confirm password" required autocomplete="new-password" />
                    <button type="submit" class="btn btn-primary btn-block" id="signUpBtn">Create Account</button>
                </form>
            </div>

            <!-- Switch link -->
            <p class="auth-switch" id="authSwitch">
                Don't have an account?
                <button onclick="switchTab('signup')">Sign up</button>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // If already logged in, skip login page
        if (localStorage.getItem('shopease_token')) {
            window.location.href = 'index.html';
        }

        function switchTab(tab) {
            const isSignIn = tab === 'signin';
            document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
            document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
            document.getElementById('panelSignIn').classList.toggle('active', isSignIn);
            document.getElementById('panelSignUp').classList.toggle('active', !isSignIn);
            document.getElementById('authSwitch').innerHTML = isSignIn
                ? `Don't have an account? <button onclick="switchTab('signup')">Sign up</button>`
                : `Already have an account? <button onclick="switchTab('signin')">Sign in</button>`;
            clearError();
        }

        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.classList.add('show');
        }

        function clearError() {
            const el = document.getElementById('authError');
            el.textContent = '';
            el.classList.remove('show');
        }

        function setLoading(btnId, loading, text) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait…' : text;
        }

        function onAuthSuccess(data) {
            localStorage.setItem('shopease_token', data.token);
            localStorage.setItem('shopease_user', JSON.stringify({
                id: data.id,
                fullName: data.fullName,
                email: data.email,
                role: data.role,
            }));
            window.location.href = 'index.html';
        }

        // Sign In
        document.getElementById('signInForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const form = e.target;
            const email = form.email.value.trim();
            const password = form.password.value;
            if (!email || !password) { showError('Please fill in all fields.'); return; }

            setLoading('signInBtn', true, 'Sign In');
            try {
                const data = await AuthAPI.login({ email, password });
                onAuthSuccess(data);
            } catch (err) {
                showError(err.message || 'Login failed. Check your credentials.');
            } finally {
                setLoading('signInBtn', false, 'Sign In');
            }
        });

        // Sign Up
        document.getElementById('signUpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const form = e.target;
            const fullName = form.fullName.value.trim();
            const email = form.email.value.trim();
            const password = form.password.value;
            const confirmPassword = form.confirmPassword.value;

            if (!fullName || !email || !password || !confirmPassword) {
                showError('Please fill in all fields.'); return;
            }
            if (password !== confirmPassword) {
                showError('Passwords do not match.'); return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters.'); return;
            }

            setLoading('signUpBtn', true, 'Create Account');
            try {
                const data = await AuthAPI.register({ fullName, email, password });
                onAuthSuccess(data);
            } catch (err) {
                showError(err.message || 'Registration failed. Please try again.');
            } finally {
                setLoading('signUpBtn', false, 'Create Account');
            }
        });
    </script>
</body>
</html>
